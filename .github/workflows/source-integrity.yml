name: Source Integrity
on:
  pull_request:
  push:
    branches: [main, master, dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check source before executing application code
        run: |
          python3 scripts/testSourceIntegrity.py
          python3 scripts/checkSourceIntegrity.py

  frontend-verification:
    needs: source-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test -- --watchAll=false --runInBand --silent
      - name: Build production frontend
        run: CI=false npm run build
